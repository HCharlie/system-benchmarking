[project]
name = "system-benchmarking"
version = "0.1.0"
description = "Extensible system benchmarks for CPU, GPU, memory, and real workloads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "HCharlie" }
]
dependencies = []

[project.scripts]
system-benchmark = "system_benchmarking.cli:main"

[build-system]
